<style data-keep="">
/* Layout: sticky scoreboard header with the tab bar inside it, single working column; the bottom stays clear for the viewer's own banners */
:root{
  --bg:#E9EDEF; --surface:#FFFFFF; --sunk:#DDE3E6; --ink:#14202A; --muted:#566673; --line:#C9D2D8;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --honey:#F4B731; --honey-ink:#1B1406; --honey-soft:#3A2D0B;
  --red:#F06A70; --red-soft:#3A1A1D; --blue:#6E9CF0; --blue-soft:#18264A;
  --good:#4CC38A; --warn:#E8A33C; --bad:#F2766B;
  --pollen:#E9C43A; --pollen-ink:#2A2100; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#172028; --sunk:#0A0E12; --ink:#E6ECEF; --muted:#93A3AE; --line:#2B3843;
  --honey:#F4B731; --honey-ink:#1B1406; --honey-soft:#3A2D0B;
  --red:#F06A70; --red-soft:#3A1A1D; --blue:#6E9CF0; --blue-soft:#18264A;
  --good:#4CC38A; --warn:#E8A33C; --bad:#F2766B;
  --pollen:#E9C43A; --pollen-ink:#2A2100; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}

button{cursor:pointer}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.mark{flex:none;width:30px;height:30px}
.brand{min-width:0;flex:1}

.pill{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted);border:0}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--good)} .pill.wait{color:var(--warn)} .pill.bad{color:var(--bad)}

.tabs{background:var(--surface);border-top:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}

main{padding-block:16px 24px;display:grid;gap:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance;line-height:1.1}

p{margin:0}

.who{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;border-left:8px solid var(--line);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.who.red{border-left-color:var(--red)} .who.blue{border-left-color:var(--blue)}
.who .m{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.who .t{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.who .n{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who > div{min-width:0;flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r);padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:7px;min-height:48px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.ctrs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;min-width:0}
.ctr label{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.ctr label i{width:12px;height:12px;border-radius:50%;flex:none}
.ctr-val{text-align:center;font-family:var(--f-display);font-weight:700;font-size:38px!important;line-height:1;padding:2px!important;min-height:50px!important;background:transparent!important;border-color:transparent!important;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ctr-val::-webkit-outer-spin-button,.ctr-val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.ctr-btns button{border:0;border-radius:8px;min-height:58px;font-family:var(--f-display);font-weight:700;font-size:26px;touch-action:manipulation;user-select:none}
.ctr-btns .minus{background:var(--sunk);color:var(--muted)}
.k-flower .plus{background:var(--honey);color:var(--honey-ink)} .k-flower label i{background:var(--honey)}
.k-miss .plus{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 2px var(--muted)} .k-miss label i{background:var(--muted)}
.k-pollen .plus{background:var(--pollen);color:var(--pollen-ink)} .k-pollen label i{background:var(--pollen)}

h3.grp{display:flex;align-items:center;gap:8px;color:var(--ink);margin-bottom:-4px}
h3.grp i{width:14px;height:14px;border-radius:50%;flex:none}
.tally{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:4px 16px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.tally b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tally span{text-align:right}
.tally span.tl{text-align:left;color:var(--muted)}
.tally b.tt{color:var(--ink);font-family:var(--f-body);font-size:14px;letter-spacing:0;font-weight:700}
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:600;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--honey);flex:none}
.check small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.check.big{border:2px solid var(--honey);background:var(--honey-soft);min-height:64px;font-size:19px;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.check.big small{font-family:var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink);opacity:.75}
.check.big input{width:32px;height:32px}
.check.big:has(input:checked){background:var(--honey);color:var(--honey-ink)}
.check.big:has(input:checked) small{color:var(--honey-ink)}
.remind{border:2px solid var(--warn);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.savebar{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.savebar .btn{min-height:56px;font-size:18px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}

th{font-family:var(--f-display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted);background:var(--sunk);position:sticky;top:0}

tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tr.sel td{background:var(--honey-soft)!important}
td.tn{font-family:var(--f-display);font-weight:700;font-size:17px}
td.nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.yes{color:var(--good);font-weight:700}
.dim{color:var(--muted)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--honey);vertical-align:middle;margin-left:6px}

.entry{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:0}
.entry .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.blue{background:var(--blue-soft);color:var(--blue)} .tag.good{color:var(--good)}
.evlist{display:grid;gap:8px}
.ev{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ev > div{flex:1 1 160px;min-width:0}
.ev.cur{border-color:var(--honey);background:var(--honey-soft)}
.ev b{display:block;font-family:var(--f-display);font-size:18px;letter-spacing:.03em}
.pub{border-color:var(--honey);background:var(--honey-soft)}
.seg.sm button{min-height:40px;font-size:16px}
.seg.sm button small{font-size:11px}
.tag.lg{background:var(--honey-soft);color:var(--honey-ink)}
:root[data-theme="dark"] .tag.lg{color:var(--honey)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lg{color:var(--honey)}}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.preview{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--sunk)}
.preview.ok{color:var(--good)} .preview.bad{color:var(--bad)}
.empty{text-align:center;padding:28px 16px;display:grid;gap:12px;justify-items:center}
.empty svg{width:56px;height:56px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
#toast{position:fixed;left:50%;top:calc(124px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}

<script data-keep="">
document.body.appendChild(document.getElementById('shell').content.cloneNode(true));
/* ---------- storage (per-device, offline) ---------- */
const LS={
  get(k,d){try{const v=localStorage.getItem('bbz.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bbz.'+k,JSON.stringify(v))}catch(e){}}
};
/* some browsers (signed-out visitors, private windows) refuse storage: then entries live only until the page reloads */
let STORE_OK=true;try{localStorage.setItem('bbz.t','1');STORE_OK=localStorage.getItem('bbz.t')==='1';localStorage.removeItem('bbz.t')}catch(e){STORE_OK=false}
const S={
  events:LS.get('events',{}), entries:LS.get('entries',{}), outbox:LS.get('outbox',{}),
  cur:LS.get('cur',null), scout:LS.get('scout',''), station:LS.get('station',''),
  draft:LS.get('draft',null), view:'scout', phase:'auto', pickMatch:LS.get('pickMatch',''),
  db:null, dl:null, dbState:'connecting', readOnly:false, quota:false, flushing:false, unsubE:null,
  sort:{k:'totL',d:-1}, detail:null, armed:null,
  setup:{season:'2026',code:'',name:'',group:'',teamsText:'',schedText:'',editing:null}, importText:'',
  art:null, canPublish:false, publishing:false, scope:LS.get('scope','event'), subSig:'', sentAt:LS.get('sentAt',0)
};
function persist(){LS.set('events',S.events);LS.set('entries',S.entries);LS.set('outbox',S.outbox);LS.set('cur',S.cur);LS.set('scout',S.scout);LS.set('station',S.station);LS.set('pickMatch',S.pickMatch);LS.set('scope',S.scope)}
function saveDraft(){LS.set('draft',S.draft)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
/* per period: pL/pM = pollen launched/missed, nL/nM = nectar launched/missed, pF/nF = pollen/nectar loaded into flowers */
const PH=['pL','pM','nL','nM','pF','nF'];
const blank=()=>({pL:0,pM:0,nL:0,nM:0,pF:0,nF:0});
function normPhase(o){o=o||{};const r=blank();for(const k of PH)r[k]=+o[k]||0;if(o.pollen!=null&&o.pF==null)r.pF=+o.pollen||0;if(o.nectar!=null&&o.nF==null)r.nF=+o.nectar||0;return r}
function normEntry(e){if(!e)return e;return {...e,auto:normPhase(e.auto),tele:normPhase(e.tele)}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2200)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}

const curEvent=()=>{const e=S.events[S.cur];return e&&!e.deleted?e:null};
function teamName(n,ev=curEvent()){const t=ev&&ev.teams.find(t=>t.n==n);return t?t.name:''}
const evEntries=()=>Object.values(S.entries).filter(e=>e.event===S.cur&&!e.deleted).map(normEntry);
const pending=()=>Object.keys(S.outbox).length;
/* leagues: events with the same League name share data; an event with no league stands alone */
const gkey=g=>String(g||'').trim().toLowerCase();
const leagueOf=ev=>ev?String(ev.group||'').trim():'';
const liveEvents=()=>Object.values(S.events).filter(e=>!e.deleted);
function leagueKeys(ev){const g=gkey(leagueOf(ev));return g?liveEvents().filter(e=>gkey(e.group)===g).map(e=>e.key):(ev?[ev.key]:[])}
function scopeKeys(){const ev=curEvent();if(!ev)return [];return S.scope==='league'&&leagueOf(ev)?leagueKeys(ev):[ev.key]}
function entriesFor(keys){const k=new Set(keys);return Object.values(S.entries).filter(e=>k.has(e.event)&&!e.deleted).map(normEntry)}
function teamNameIn(n,keys){for(const k of keys){const t=(S.events[k]||{teams:[]}).teams.find(t=>t.n==n);if(t&&t.name)return t.name}return ''}
function leagueNames(){const m=new Map();for(const e of liveEvents()){const g=leagueOf(e);if(g&&!m.has(gkey(g)))m.set(gkey(g),g)}return [...m.values()].sort()}

/* ---------- parsing imports ---------- */
function walk(o,fn){if(Array.isArray(o))o.forEach(x=>walk(x,fn));else if(o&&typeof o==='object'){fn(o);Object.values(o).forEach(v=>walk(v,fn))}}
function tryJSON(t){t=t.trim();if(!/^[\[{]/.test(t))return null;try{return JSON.parse(t)}catch(e){return null}}

function parseTeams(text){
  const out=new Map();const j=tryJSON(text);
  if(j){walk(j,o=>{const n=+(o.teamNumber??o.number);if(n>0&&n<100000&&!o.station&&!o.alliance){const nm=o.nameShort||o.teamName||o.name||(o.team&&o.team.name)||'';if(!out.has(n)||nm)out.set(n,String(nm||out.get(n)||''))}});}
  else{
    const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    for(let i=0;i<lines.length;i++){
      const l=lines[i];let m=l.match(/^(\d{1,5})\s*[\t,|;]\s*([^\t,|;]+)/)||l.match(/^(\d{1,5})\s+(.*\D.*)$/);
      if(m){out.set(+m[1],m[2].trim());continue}
      if(/^\d{1,5}$/.test(l)){const nx=lines[i+1];if(nx&&!/^\d+$/.test(nx)){out.set(+l,nx.split('\t')[0].trim());i++}else out.set(+l,'')}
    }
  }
  return [...out].filter(([n])=>n>0).map(([n,name])=>({n,name})).sort((a,b)=>a.n-b.n);
}

function labelFor(level,num){const lv=String(level||'').toLowerCase();if(!lv||lv.startsWith('qual'))return 'Q'+num;if(lv.startsWith('final'))return 'F'+num;return 'P'+num}
function parseSchedule(text){
  const j=tryJSON(text);const out=[];
  if(j){
    walk(j,o=>{
      if(!Array.isArray(o.teams)||!o.teams.length||o.teams[0].teamNumber==null)return;
      const red=[],blue=[];
      for(const t of o.teams){const s=String(t.alliance||t.station||'');const n=+t.teamNumber;if(!n)continue;if(/^red/i.test(s))red.push(n);else if(/^blue/i.test(s))blue.push(n)}
      if(!red.length&&!blue.length)return;
      const num=o.matchNumber??o.matchNum??o.series??(String(o.description||'').match(/\d+/)||[0])[0];
      const level=o.tournamentLevel||o.level||(/qual/i.test(o.description||'')?'qual':'');
      out.push({label:labelFor(level,num),num:+num,level:String(level||'qual'),red,blue});
    });
  }else{
    let cur=null;const flush=()=>{if(cur&&cur.nums.length>=4){out.push({label:cur.label||('Q'+(out.length+1)),num:cur.num||out.length+1,level:cur.level,red:cur.nums.slice(0,2),blue:cur.nums.slice(2,4)})}cur=null};
    for(let raw of text.split(/\r?\n/)){
      let l=raw.replace(/\d{1,2}:\d{2}(:\d{2})?\s*([ap]\.?m\.?)?/gi,' ').replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g,' ').replace(/\*/g,'');
      if(!l.trim())continue;
      const lab=l.match(/\b(qualification|qual|q|semi-?final|final|playoff|match|m)\s*#?\s*-?\s*(\d{1,3})\b/i);
      if(lab){flush();const w=lab[1].toLowerCase();const level=w.startsWith('q')||w==='match'||w==='m'?'qual':(w.startsWith('final')?'final':'playoff');cur={label:labelFor(level,+lab[2]),num:+lab[2],level,nums:[]};l=l.slice(lab.index+lab[0].length)}
      const nums=(l.match(/\b\d{1,5}\b/g)||[]).map(Number).filter(n=>n>0);
      if(!cur){
        if(nums.length>=5){out.push({label:'Q'+nums[0],num:nums[0],level:'qual',red:nums.slice(1,3),blue:nums.slice(3,5)});continue}
        if(nums.length===4){out.push({label:'Q'+(out.length+1),num:out.length+1,level:'qual',red:nums.slice(0,2),blue:nums.slice(2,4)});continue}
        continue;
      }
      for(const n of nums){if(cur.nums.length<4)cur.nums.push(n)}
      if(cur.nums.length>=4)flush();
    }
    flush();
  }
  const seen=new Map();for(const m of out)seen.set(m.label,m);
  const lvOrder=l=>/^q/i.test(l)?0:/^f/i.test(l)?2:1;
  return [...seen.values()].sort((a,b)=>lvOrder(a.label)-lvOrder(b.label)||a.num-b.num);
}

/* ---------- shared store (online merge) ---------- */
function newerThan(a,b){return !b||(a.updatedAt||0)>(b.updatedAt||0)}
function mergeEntry(r){if(!r||!r.id)return false;const l=S.entries[r.id];if(S.outbox['e:'+r.id]&&l&&(l.updatedAt||0)>=(r.updatedAt||0))return false;if(newerThan(r,l)){S.entries[r.id]=r;return true}return false}
function mergeEvent(r){if(!r||!r.key)return false;const l=S.events[r.key];if(S.outbox['v:'+r.key]&&l&&(l.updatedAt||0)>=(r.updatedAt||0))return false;if(newerThan(r,l)){S.events[r.key]=r;return true}return false}
function queue(kind,id){S.outbox[kind+':'+id]=1;persist();renderStatus();flushSoon()}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
let flushT=null;function flushSoon(){clearTimeout(flushT);flushT=setTimeout(flush,400)}
async function flush(){
  if(!S.db||S.flushing||S.readOnly||!pending()||navigator.onLine===false){renderStatus();return}
  S.flushing=true;renderStatus();
  try{
    for(const key of Object.keys(S.outbox)){
      const [kind,id]=[key.slice(0,1),key.slice(2)];
      const body=kind==='e'?S.entries[id]:S.events[id];
      if(!body){delete S.outbox[key];continue}
      try{
        await withTimeout(S.db.collection(kind==='e'?'entries':'events').doc(id).set(JSON.parse(JSON.stringify(body))),15000);
        delete S.outbox[key];persist();
      }catch(e){
        if(e&&e.code==='invalid_argument'){S.readOnly=true;break}
        if(e&&e.code==='quota_exceeded'){S.quota=true;break}
        if(e&&e.code==='revoked'){S.dbState='none';break}
        break; // offline / transient: keep in outbox and try later
      }
    }
  }finally{S.flushing=false;renderStatus()}
}
function subEvents(){
  S.db.collection('events').onSnapshot(snap=>{let ch=false;for(const d of snap.docs)if(mergeEvent(d.data()))ch=true;if(ch){persist();if(leagueKeys(curEvent()).slice(0,30).join('|')!==S.subSig)subEntries();softRender()}},()=>{S.dbState='error';renderStatus()});
}
function subEntries(){
  if(S.unsubE){try{S.unsubE()}catch(e){}S.unsubE=null}
  S.subSig='';
  if(!S.db||!curEvent())return;
  const keys=leagueKeys(curEvent()).slice(0,30);S.subSig=keys.join('|');
  const q=keys.length>1?S.db.collection('entries').where('event','in',keys):S.db.collection('entries').where('event','==',keys[0]);
  S.unsubE=q.onSnapshot(snap=>{let ch=false;for(const d of snap.docs)if(mergeEntry(d.data()))ch=true;if(ch){persist();softRender()}},()=>{S.dbState='error';renderStatus()});
}
async function connect(){
  let db=null,dl=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  S.dl=dl;
  try{const art=window.claude&&window.claude.use?await window.claude.use('artifact'):null;const user=window.claude&&window.claude.use?await window.claude.use('user'):null;
    S.art=art;S.canPublish=!!(art&&user&&await user.canEdit());if(S.view==='event')softRender()}catch(e){S.canPublish=false}
  if(!db){S.dbState='none';renderStatus();if(S.view==='sync')render();return}
  S.db=db;S.dbState='ok';subEvents();subEntries();flush();renderStatus();if(S.view==='sync')render();
}
window.addEventListener('online',()=>{renderStatus();flush()});
window.addEventListener('offline',renderStatus);
setInterval(()=>{if(pending())flush()},20000);

function renderStatus(){
  const p=pending(),pill=$('#syncpill'),t=pill.querySelector('span');pill.className='pill';
  if(S.dbState==='connecting'){t.textContent='Starting…'}
  else if(S.dbState==='none'){const u=unsentCount();pill.classList.add(u?'wait':'ok');t.textContent=u?`On this phone · ${u} to send`:'On this phone · all sent'}
  else if(S.readOnly){pill.classList.add('bad');t.textContent='View only'}
  else if(S.quota){pill.classList.add('bad');t.textContent='Storage full'}
  else if(navigator.onLine===false){pill.classList.add('wait');t.textContent=p?`Offline · ${p} waiting`:'Offline'}
  else if(p){pill.classList.add('wait');t.textContent=`Syncing ${p}`}
  else if(S.dbState==='error'){pill.classList.add('bad');t.textContent='Sync paused'}
  else{pill.classList.add('ok');t.textContent='Synced'}
  const ev=curEvent();$('#evname').textContent=ev?`${ev.name||ev.code}${leagueOf(ev)?' · '+leagueOf(ev):''} · ${ev.season}-${String(+ev.season+1).slice(2)}`:'No event selected';
  document.querySelectorAll('.tab').forEach(b=>{b.setAttribute('aria-current',b.dataset.go===S.view?'page':'false');const d=b.querySelector('.dot');if(d)d.remove();const dn=S.dbState==='none'?unsentCount():p;if(b.dataset.go==='sync'&&dn){const s=document.createElement('span');s.className='dot';s.textContent=dn;b.appendChild(s)}});
}

function teamStats(keys=scopeKeys()){
  const by=new Map();
  for(const k of keys)for(const t of (S.events[k]||{teams:[]}).teams){if(!by.has(+t.n))by.set(+t.n,{n:+t.n,name:t.name,list:[],ev:new Set()});else if(!by.get(+t.n).name)by.get(+t.n).name=t.name}
  for(const e of entriesFor(keys)){if(!by.has(+e.team))by.set(+e.team,{n:+e.team,name:teamNameIn(e.team,keys),list:[],ev:new Set()});const r=by.get(+e.team);r.list.push(e);r.ev.add(e.event)}
  return [...by.values()].map(r=>{
    const m=r.list.length,s=f=>r.list.reduce((a,e)=>a+(+f(e)||0),0);
    const avg=v=>m?v/m:null,acc=(h,x)=>h+x?h/(h+x):null;
    const o={...r,m,empty:r.list.filter(e=>e.canEmpty).length};
    for(const [ph,P] of [['auto','a'],['tele','t']]){
      const pL=s(e=>e[ph].pL),pM=s(e=>e[ph].pM),nL=s(e=>e[ph].nL),nM=s(e=>e[ph].nM);
      o[P+'pL']=avg(pL);o[P+'pA']=acc(pL,pM);o[P+'nL']=avg(nL);o[P+'nA']=acc(nL,nM);
    }
    const allL=s(e=>e.auto.pL+e.auto.nL+e.tele.pL+e.tele.nL),allM=s(e=>e.auto.pM+e.auto.nM+e.tele.pM+e.tele.nM);
    o.totL=avg(allL);o.totA=acc(allL,allM);
    o.pF=avg(s(e=>e.auto.pF+e.tele.pF));o.nF=avg(s(e=>e.auto.nF+e.tele.nF));
    return o;
  });
}

/* export code = BBZ1: + base64url(JSON) + :END, so email and chat apps can wrap, quote or reformat it without breaking it */
function exportPayload(){const json=JSON.stringify({app:'biobuzz-scout',v:2,exportedAt:new Date().toISOString(),from:S.scout.trim(),events:Object.values(S.events),entries:Object.values(S.entries)});

  return 'BBZ1:'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+':END'}
function decodePayload(text){
  const t=String(text||'');const m=t.match(/B\s*B\s*Z\s*1\s*:([\s\S]*?):\s*E\s*N\s*D/i);
  if(m){const s=m[1].replace(/[^A-Za-z0-9_-]/g,'').replace(/-/g,'+').replace(/_/g,'/');
    try{const bin=atob(s+'==='.slice((s.length+3)%4));const u=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(u))}catch(e){return 'broken'}}
  if(/B\s*B\s*Z\s*1\s*:/i.test(t))return 'cut';
  const a=t.indexOf('{'),z=t.lastIndexOf('}');if(a<0||z<a)return null;
  try{return JSON.parse(t.slice(a,z+1).replace(/[“”]/g,'"'))}catch(e){return 'broken'}
}
function msgImport(m,ok){S.importMsg=m;S.importOk=!!ok;toast(m.length>60?(ok?'Merged. Details below.':'Couldn\'t merge. Details below.'):m);render()}
function importPayload(text){

  let ne=0,nv=0;

  if(j.kind==='events'){if(j.cur&&S.events[j.cur]&&!S.events[j.cur].deleted){S.cur=j.cur;S.pickMatch='';S.scope='event';persist();subEntries()}
    const nev=(j.events||[]).filter(x=>!x.deleted).length;msgImport(`Loaded ${nev} event${nev===1?'':'s'}${who}. Current event: ${(curEvent()||{}).name||'none'}.`,true);return}
  if(!tot){msgImport(`This code${who}${when} has no scouting entries in it. The phone that made it isn't holding any. If that scout did scout, their browser probably isn't saving entries; the Sync tab on their phone says so.`);return}
  msgImport(`Code${who}${when}: ${tot} entr${tot===1?'y':'ies'}. ${ne} new, ${tot-ne} already on this phone.${nv?` ${nv} event update${nv===1?'':'s'}.`:''}`,true);
}
function csv(){
  const rows=teamStats();const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const n=v=>v==null?'':(+v).toFixed(2);
  const head=['Team','Name','Matches','All launches scored','All accuracy','Auto pollen scored','Auto pollen accuracy','Auto nectar scored','Auto nectar accuracy','Teleop pollen scored','Teleop pollen accuracy','Teleop nectar scored','Teleop nectar accuracy','Pollen into flowers','Nectar into flowers','Matches emptying flowers'];
  const keys=['totL','totA','apL','apA','anL','anA','tpL','tpA','tnL','tnA','pF','nF'];

async function fetchEntries(keys){
  if(!S.db||navigator.onLine===false)return false;
  try{for(let i=0;i<keys.length;i+=30){const c=keys.slice(i,i+30);const q=c.length>1?S.db.collection('entries').where('event','in',c):S.db.collection('entries').where('event','==',c[0]);

async function rawExport(which){

  const first=new Map();const ents=entriesFor(keys);

  const mnum=m=>{const x=String(m||'').match(/^([A-Za-z]*)(\d+)/);return x?[{Q:0,P:1,F:2}[x[1].toUpperCase()]??1,+x[2]]:[9,0]};
  ents.sort((a,b)=>(first.get(a.event)-first.get(b.event))||String(a.event).localeCompare(b.event)||(mnum(a.match)[0]-mnum(b.match)[0])||(mnum(a.match)[1]-mnum(b.match)[1])||(a.team-b.team)||((a.createdAt||0)-(b.createdAt||0)));
  const P=[['pL','pollen scored'],['pM','pollen missed'],['nL','nectar scored'],['nM','nectar missed'],['pF','pollen into flowers'],['nF','nectar into flowers']];
  const head=['Season','League','Event code','Event name','Date','Match','Match number','Team','Team name','Alliance','Scout',...P.map(([,l])=>'Auto '+l),...P.map(([,l])=>'Teleop '+l),'Total launches scored','Total launches missed','Launch accuracy','Total into flowers','Can empty flowers','From paper','Notes','Entry ID'];
  const pad=n=>String(n).padStart(2,'0');
  const rows=ents.map(e=>{const v=S.events[e.event]||{};const d=new Date(e.createdAt||0);
    const sc=e.auto.pL+e.auto.nL+e.tele.pL+e.tele.nL,ms=e.auto.pM+e.auto.nM+e.tele.pM+e.tele.nM;
    return [v.season||'',leagueOf(v)||'Non-league',v.code||e.event,v.name||'',`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,e.match,mnum(e.match)[1]||'',e.team,teamNameIn(e.team,[e.event]),e.alliance,e.scout||'',
      ...P.map(([k])=>e.auto[k]),...P.map(([k])=>e.tele[k]),sc,ms,sc+ms?(sc/(sc+ms)).toFixed(3):'',e.auto.pF+e.auto.nF+e.tele.pF+e.tele.nF,e.canEmpty?'Yes':'No',e.paper?'Yes':'No',e.notes||'',e.id].map(q).join(',')});
  if(!rows.length){toast(fresh||!S.db?'No entries to export yet.':'No entries on this phone yet. Connect to download the shared list.');return}
  const tag=which==='season'?`season-${ev.season}`:which==='league'?gkey(leagueOf(ev)).replace(/[^a-z0-9]+/g,'-'):ev.code;
  await saveFile(`biobuzz-raw-${tag}.csv`,[head.map(q).join(','),...rows].join('\n'));
  if(S.db&&!fresh)toast('Saved from this phone only. Go online for everyone\'s entries.');
}
const IN_CLAUDE=()=>!!(window.claude&&window.claude.use);
const canSaveFiles=()=>!!S.dl||!IN_CLAUDE();
async function saveFile(name,data){
  if(S.dl){try{await S.dl.save({filename:name,data});toast('Saved');return true}catch(e){if(e&&e.code!=='declined')toast('Couldn\'t save the file. Use Copy instead.');return false}}
  if(IN_CLAUDE()){toast('Saving files isn\'t available here. Use Copy instead.');return false}
  try{const u=URL.createObjectURL(new Blob([data],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Saved. Find it in Files › Downloads');return true}
  catch(e){toast('Couldn\'t save the file. Use Copy instead.');return false}
}
function unsentCount(){return Object.values(S.entries).filter(e=>!e.deleted&&(e.updatedAt||0)>(S.sentAt||0)).length}
function markSent(){S.sentAt=Date.now();LS.set('sentAt',S.sentAt);render()}
function backupName(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `biobuzz-backup-${(S.scout.trim()||'scout').replace(/[^A-Za-z0-9]+/g,'-')}-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.txt`}
function reminderHTML(){
  if(S.dbState==='ok'&&!S.readOnly)return '';
  const n=unsentCount();if(n<5)return '';
  return `<div class="remind"><b>${n} entries haven't been backed up or sent.</b><span class="small">Do it now, before you scout more.</span><div class="btnrow">${backupBtns()}</div></div>`;
}
function encodeCode(json){const b=new TextEncoder().encode(json);let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return 'BBZ1:'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')+':END'}
/* AirDrop / share sheet: works on iPads with no internet (outside Claude only) */
function canShareFiles(){if(IN_CLAUDE()||!navigator.canShare||!navigator.share)return false;try{return navigator.canShare({files:[new File(['x'],'x.txt',{type:'text/plain'})]})}catch(e){return false}}
async function shareFile(){
  const f=new File([exportPayload()],backupName(),{type:'text/plain'});
  try{await navigator.share({files:[f],title:'BioBuzz scouting backup'});markSent();toast('Backup sent')}
  catch(e){if(e&&e.name==='AbortError')return;toast('Sharing didn\'t work. Use Save backup file instead.')}
}
function backupBtns(){const sh=canShareFiles();return `${sh?'<button class="btn primary" data-act="share-file">AirDrop / share backup</button>':''}${canSaveFiles()?`<button class="btn ${sh?'':'primary'}" data-act="file-export">Save backup file</button>`:''}<button class="btn" data-act="copy-export">Copy export code</button>`}
function setupPayload(){return encodeCode(JSON.stringify({app:'biobuzz-scout',v:2,kind:'events',exportedAt:new Date().toISOString(),from:S.scout.trim(),cur:S.cur,events:liveEvents(),entries:[]}))}
async function copyText(t,boxId='exportBox'){
  try{await navigator.clipboard.writeText(t);toast('Copied');return true}catch(e){
    const box=document.getElementById(boxId);if(box){box.hidden=false;box.value=t;box.focus();box.select();toast('Copying is blocked here. Select all the text in the box and copy it.')}else toast('Copying is blocked here. Use Save file instead.');return false}
}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){S.view=go.dataset.go;S.armed=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest('button,[data-team]');if(!b)return;
  const ds=b.dataset;
  if(ds.act==='inc'||ds.act==='dec'){setCount(ds.p,ds.k,S.draft[ds.p][ds.k]+(ds.act==='inc'?1:-1));buzz();return}
  if(ds.phase){S.phase=ds.phase;render();return}
  if(ds.pick){S.station=ds.st;persist();startDraft(+ds.pick,ds.al,S.pickMatch);return}
  if(ds.scope){S.scope=ds.scope;S.detail=null;persist();render();return}
  if(ds.raw){rawExport(ds.raw);return}
  if(ds.sort){S.sort=S.sort.k===ds.sort?{k:ds.sort,d:-S.sort.d}:{k:ds.sort,d:ds.sort==='n'||ds.sort==='name'?1:-1};render();return}
  if(ds.team){S.detail=S.detail==ds.team?null:+ds.team;S.armed=null;render();return}
  if(ds.edit){const x=S.entries[ds.edit];if(!x)return;S.draft={id:x.id,event:x.event,match:x.match,team:x.team,alliance:x.alliance,auto:normPhase(x.auto),tele:normPhase(x.tele),canEmpty:x.canEmpty,paper:x.paper,notes:x.notes};S.cur=x.event;S.phase='auto';saveDraft();S.view='scout';render();window.scrollTo(0,0);return}
  if(ds.del){if(S.armed!=='del:'+ds.del){S.armed='del:'+ds.del;render();return}const x=S.entries[ds.del];if(x){x.deleted=true;x.updatedAt=Date.now();queue('e',x.id)}S.armed=null;toast('Entry deleted');render();return}
  if(ds.use){S.cur=ds.use;S.pickMatch='';S.scope='event';persist();subEntries();toast('Event switched');render();return}
  if(ds.delev){const k=ds.delev;if(S.armed!=='delev:'+k){S.armed='delev:'+k;render();return}
    const v=S.events[k];if(v){v.deleted=true;v.updatedAt=Date.now();queue('v',k)}
    if(S.cur===k){S.cur=(Object.values(S.events).find(e=>!e.deleted)||{}).key||null;S.pickMatch='';subEntries()}
    S.armed=null;persist();toast('Event deleted on every phone');render();return}
  if(ds.editev){const v=S.events[ds.editev];S.setup={season:String(v.season),code:v.code,name:v.name||'',group:leagueOf(v),teamsText:'',schedText:'',editing:v.key};render();window.scrollTo(0,0);return}
  switch(ds.act){
    case 'manual':{const mm=+$('#manMatch').value,tt=+$('#manTeam').value;if(!mm||!tt){toast('Enter a match number and a team number');return}startDraft(tt,$('#manAl').value,'Q'+mm);return}
    case 'change':S.armed=S.draft.id?null:'change';if(S.draft.id){S.draft=null;saveDraft();S.view='teams'}render();return;
    case 'change-confirm':S.draft=null;S.armed=null;saveDraft();render();return;
    case 'reset':S.armed='reset';render();return;
    case 'reset-confirm':S.draft.auto=blank();S.draft.tele=blank();S.armed=null;saveDraft();render();return;
    case 'save':saveEntry();return;
    case 'close-detail':S.detail=null;render();return;
    case 'csv':saveFile(`biobuzz-${(curEvent()||{}).code||'event'}-teams.csv`,csv());return;
    case 'clear-setup':S.setup={season:'2026',code:'',name:'',group:'',teamsText:'',schedText:'',editing:null};render();return;
    case 'save-event':{
      const st=S.setup;const code=st.code.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');const season=String(+st.season||2026);
      if(!code){toast('Enter the event code');return}
      const key=season+'-'+code;const old=S.events[key];
      let teams=st.teamsText.trim()?parseTeams(st.teamsText):(old?old.teams:[]);
      const matches=st.schedText.trim()?parseSchedule(st.schedText):(old?old.matches:[]);
      const have=new Set(teams.map(t=>t.n));for(const m of matches)for(const t of [...m.red,...m.blue])if(!have.has(t)){have.add(t);teams.push({n:t,name:(old&&old.teams.find(x=>x.n===t)||{}).name||''})}
      teams.sort((a,b)=>a.n-b.n);
      let group=String(st.group||'').trim();const same=leagueNames().find(g=>gkey(g)===gkey(group));if(same)group=same;
      S.events[key]={key,season:+season,code,name:st.name.trim()||(old&&old.name)||code,group,teams,matches,updatedAt:Date.now()};
      S.cur=key;S.pickMatch='';queue('v',key);subEntries();
      S.setup={season,code:'',name:'',group:'',teamsText:'',schedText:'',editing:null};
      toast(`Saved ${code}: ${teams.length} teams, ${matches.length} matches`);S.view=S.canPublish?'event':'scout';render();window.scrollTo(0,0);return}
    case 'publish-page':if(S.armed!=='pub'){S.armed='pub';render();return}publishPage();return;
    case 'sync-now':flush();toast('Syncing…');return;
    case 'copy-export':copyText(exportPayload()).then(ok=>{if(ok){markSent();toast(`Copied ${exportCount()} entries. Paste them to your lead scout.`)}});return;
    case 'file-export':saveFile(backupName(),exportPayload()).then(ok=>{if(ok)markSent()});return;
    case 'share-file':shareFile();return;
    case 'copy-setup':copyText(setupPayload(),'setupBox').then(ok=>{if(ok)toast('Copied event setup code')});return;
    case 'file-setup':{const d=new Date(),p=n=>String(n).padStart(2,'0');saveFile(`biobuzz-setup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.txt`,setupPayload());return}
    case 'import':{const t=($('#importText')||{}).value||'';if(!t.trim()){toast('Paste an export code first');return}importPayload(t);return}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('ctr-val')){setCount(t.dataset.p,t.dataset.k,t.value,true);return}
  if(t.id==='scoutName'){S.scout=t.value;persist();return}
  if(t.id==='notes'){S.draft.notes=t.value;saveDraft();return}
  if(t.id==='suSeason'){S.setup.season=t.value;refreshSoon();return}
  if(t.id==='suCode'){S.setup.code=t.value;refreshSoon();return}
  if(t.id==='suName'){S.setup.name=t.value;return}
  if(t.id==='suGroup'){S.setup.group=t.value;return}
  if(t.id==='suTeams'){S.setup.teamsText=t.value;refreshSoon();return}
  if(t.id==='suSched'){S.setup.schedText=t.value;refreshSoon();return}
  if(t.id==='importText'){S.importText=t.value;return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('ctr-val')){t.value=S.draft[t.dataset.p][t.dataset.k];return}
  if(t.id==='matchSel'){S.pickMatch=t.value;persist();render();return}
  if(t.id==='canEmpty'){S.draft.canEmpty=t.checked;saveDraft();return}
  if(t.id==='paper'){S.draft.paper=t.checked;saveDraft();return}
  if(['suSeason','suCode','suTeams','suSched'].includes(t.id))return; /* previews update while typing; changing layout on blur moved the Save button out from under the tap */
  if(t.id==='importFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>importPayload(String(r.result||''));r.readAsText(t.files[0]);t.value='';return}
});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('ctr-val'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
/* events built into the page reach every visitor, including people not signed in */
let SEED={events:[]};
try{const seed=SEED=JSON.parse((document.getElementById('seed')||{}).textContent||'{}');for(const v of seed.events||[])mergeEvent(v);
  if(!S.cur||!S.events[S.cur]||S.events[S.cur].deleted)S.cur=(seed.cur&&S.events[seed.cur])?seed.cur:(Object.values(S.events).filter(e=>!e.deleted).sort((a,b)=>(b.teams.length>0)-(a.teams.length>0)||(b.updatedAt||0)-(a.updatedAt||0))[0]||{}).key||null;
  persist()}catch(e){}
if(S.draft&&S.draft.event!==S.cur)S.draft=null;
if(S.draft){S.draft.auto=normPhase(S.draft.auto);S.draft.tele=normPhase(S.draft.tele)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();connect();
</script></body></html>
